<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D48B"/>
      <stop offset="50%" style="stop-color:#C9A84C"/>
      <stop offset="100%" style="stop-color:#A8872E"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A84C"/>
      <stop offset="100%" style="stop-color:#E8D48B"/>
    </linearGradient>
  </defs>
  
  <!-- Crown -->
  <g transform="translate(2, 2)">
    <!-- Crown base -->
    <path d="M5 35 L5 18 Q15 14 20 20 Q25 10 30 14 Q35 8 40 14 Q45 10 50 20 Q55 14 65 18 L65 35 Z" 
          fill="url(#goldGrad)" stroke="#A8872E" stroke-width="0.5"/>
    <!-- Crown gems -->
    <circle cx="20" cy="22" r="2.5" fill="#CE1126"/>
    <circle cx="35" cy="18" r="2.5" fill="#006C35"/>
    <circle cx="50" cy="22" r="2.5" fill="#CE1126"/>
    <!-- Crown top spikes -->
    <path d="M15 20 L18 8 L21 19" fill="url(#goldGrad2)"/>
    <path d="M30 16 L33 4 L36 15" fill="url(#goldGrad2)"/>
    <path d="M45 16 L48 4 L51 15" fill="url(#goldGrad2)"/>
    <!-- Crown rim -->
    <rect x="5" y="33" width="60" height="3" rx="1" fill="url(#goldGrad2)"/>
    
    <!-- Sword behind crown -->
    <line x1="55" y1="12" x2="70" y2="55" stroke="#C9A84C" stroke-width="1.5" opacity="0.4"/>
    <line x1="15" y1="12" x2="0" y2="55" stroke="#C9A84C" stroke-width="1.5" opacity="0.4"/>
  </g>
  
  <!-- Text: KINGDOM -->
  <text x="75" y="25" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="700" fill="#E8D48B" letter-spacing="3">KINGDOM</text>
  <!-- Text: GRILL -->
  <text x="75" y="40" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="700" fill="url(#goldGrad2)" letter-spacing="4">GRILL</text>
  <!-- Divider -->
  <line x1="75" y1="45" x2="190" y2="45" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.5"/>
  <!-- Arabic -->
  <text x="75" y="56" font-family="'Noto Naskh Arabic', serif" font-size="8" fill="#8A8478" letter-spacing="1">مشاوي المملكة</text>
</svg>
