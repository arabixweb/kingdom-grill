<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6B8"/>
      <stop offset="30%" style="stop-color:#D4AF37"/>
      <stop offset="60%" style="stop-color:#C9A84C"/>
      <stop offset="100%" style="stop-color:#996515"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#F5E6B8"/>
      <stop offset="100%" style="stop-color:#C9A84C"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#996515"/>
    </linearGradient>
  </defs>

  <!-- Icon: Elegant Arabian flame/leaf + gold crescent -->
  <g transform="translate(4, 8)">
    <!-- Palm leaf left -->
    <path d="M34 44 Q20 36 12 24 Q8 18 10 14 Q12 18 16 22 Q22 28 30 36 Z" 
          fill="url(#g)" opacity="0.9"/>
    <!-- Palm leaf right -->
    <path d="M34 44 Q48 36 56 24 Q60 18 58 14 Q56 18 52 22 Q46 28 38 36 Z" 
          fill="url(#g)" opacity="0.9"/>
    <!-- Diamond center -->
    <polygon points="34,10 42,22 34,38 26,22" fill="url(#g2)" stroke="#996515" stroke-width="0.8"/>
    <!-- Gold dot center -->
    <circle cx="34" cy="22" r="4" fill="#F5E6B8" opacity="0.9"/>
    <circle cx="34" cy="22" r="2" fill="#D4AF37"/>
    <!-- Arabian crescent top -->
    <path d="M34 2 Q38 6 36 10 Q34 7 32 10 Q30 6 34 2 Z" fill="#D4AF37"/>
  </g>

  <!-- KINGDOM text -->
  <text x="78" y="23" font-family="'Playfair Display', 'Georgia', serif" font-size="11" font-weight="600" fill="#B8A88A" letter-spacing="4">KINGDOM</text>
  
  <!-- GRILL text big -->
  <text x="78" y="42" font-family="'Playfair Display', 'Georgia', serif" font-size="18" font-weight="700" fill="url(#g2)" letter-spacing="3.5">GRILL</text>
  
  <!-- Refined divider -->
  <line x1="78" y1="47" x2="230" y2="47" stroke="url(#g)" stroke-width="0.7" opacity="0.5"/>
  
  <!-- Arabic - elegant -->
  <text x="78" y="59" font-family="'Noto Naskh Arabic', 'Traditional Arabic', serif" font-size="8.5" fill="#8A8478" letter-spacing="0.5">مـشــاوي الـمـمـلـكــة</text>
</svg>
