<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتصل بنا | Contact — Kingdom Grill</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div id="header-placeholder"></div>

  <!-- Page Hero -->
  <section class="page-hero">
    <div class="page-hero-bg contact-bg"></div>
    <div class="page-hero-content">
      <span class="page-badge" data-en="✦ Get in Touch ✦" data-ar="✦ تواصل معنا ✦">✦ Get in Touch ✦</span>
      <h1 class="page-title" data-en="We'd Love to" data-ar="يسعدنا">We'd Love to</h1>
      <h1 class="page-title accent" data-en="Hear From You" data-ar="سماع منك">Hear From You</h1>
    </div>
  </section>

  <!-- Contact Section -->
  <section class="page-section">
    <div class="contact-container">
      <div class="contact-info">
        <div class="contact-item">
          <i class="fas fa-map-pin"></i>
          <div>
            <h4 data-en="Address" data-ar="العنوان">Address</h4>
            <p>King Fahd Road, Riyadh, Saudi Arabia</p>
          </div>
        </div>
        <div class="contact-item">
          <i class="fas fa-phone"></i>
          <div>
            <h4 data-en="Phone" data-ar="الهاتف">Phone</h4>
            <p>+966 55 123 4567</p>
          </div>
        </div>
        <div class="contact-item">
          <i class="fas fa-envelope"></i>
          <div>
            <h4 data-en="Email" data-ar="البريد الإلكتروني">Email</h4>
            <p>info@kingdomgrill.sa</p>
          </div>
        </div>
        <div class="social-links">
          <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
          <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
          <a href="#" aria-label="Snapchat"><i class="fab fa-snapchat"></i></a>
          <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        </div>
      </div>

      <div class="contact-map">
        <div class="map-placeholder">
          <i class="fas fa-map-marked-alt"></i>
          <p data-en="King Fahd Road, Riyadh, Saudi Arabia" data-ar="طريق الملك فهد، الرياض، المملكة العربية السعودية">King Fahd Road, Riyadh, Saudi Arabia</p>
          <span data-en="Google Map integration here" data-ar="خريطة جوجل هنا">📍 Google Map integration here</span>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="../js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSharedComponents('contact');
    });
  </script>
</body>
</html>
