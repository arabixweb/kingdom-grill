<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحجز | Reservation — Kingdom Grill</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <section class="page-hero">
    <div class="page-hero-particles"></div>
    <div class="page-hero-content">
      <span class="page-badge" data-en="✦ Book Experience ✦" data-ar="✦ احجز تجربتك ✦">✦ Book Experience ✦</span>
      <h1 class="page-title" data-en="Reserve Your" data-ar="احجز">Reserve Your</h1>
      <h1 class="page-title accent" data-en="Royal Table" data-ar="طاولتك الملكية">Royal Table</h1>
    </div>
  </section>

  <section class="page-section reservation-section" style="padding-top:0;">
    <div class="reservation-content" style="margin-top:60px;">
      <div class="reservation-info">
        <div class="info-card">
          <i class="fas fa-clock"></i>
          <h3 data-en="Opening Hours" data-ar="ساعات العمل">Opening Hours</h3>
          <p data-en="Daily: 12:00 PM - 1:00 AM" data-ar="يوميًا: 12:00 م - 1:00 ص">Daily: 12:00 PM – 1:00 AM</p>
          <p data-en="Friday Brunch: 11:00 AM - 3:00 PM" data-ar="الجمعة: 11:00 ص - 3:00 م">Friday Brunch: 11:00 AM – 3:00 PM</p>
        </div>
        <div class="info-card">
          <i class="fas fa-map-marker-alt"></i>
          <h3 data-en="Location" data-ar="الموقع">Location</h3>
          <p data-en="King Fahd Road, Riyadh, Saudi Arabia" data-ar="طريق الملك فهد، الرياض، المملكة العربية السعودية">King Fahd Road, Riyadh, Saudi Arabia</p>
        </div>
        <div class="info-card">
          <i class="fas fa-phone-alt"></i>
          <h3 data-en="Contact" data-ar="الاتصال">Contact</h3>
          <p>+966 55 123 4567</p>
          <p>info@kingdomgrill.sa</p>
        </div>
      </div>

      <form class="reservation-form" id="reservationForm">
        <div class="form-row">
          <div class="form-group">
            <input type="text" id="resName" placeholder=" " required>
            <label for="resName" data-en="Your Name" data-ar="الاسم">Your Name</label>
          </div>
          <div class="form-group">
            <input type="tel" id="resPhone" placeholder=" " required>
            <label for="resPhone" data-en="Phone Number" data-ar="رقم الهاتف">Phone Number</label>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <input type="date" id="resDate" required>
            <label class="float-label" data-en="Date" data-ar="التاريخ">Date</label>
          </div>
          <div class="form-group">
            <input type="time" id="resTime" required>
            <label class="float-label" data-en="Time" data-ar="الوقت">Time</label>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <select id="resGuests" required>
              <option value="" data-en="2 Guests" data-ar="2 ضيوف">2 Guests</option>
              <option value="1" data-en="1 Guest" data-ar="ضيف واحد">1 Guest</option>
              <option value="2" selected data-en="2 Guests" data-ar="2 ضيوف">2 Guests</option>
              <option value="3" data-en="3 Guests" data-ar="3 ضيوف">3 Guests</option>
              <option value="4" data-en="4 Guests" data-ar="4 ضيوف">4 Guests</option>
              <option value="5" data-en="5 Guests" data-ar="5 ضيوف">5 Guests</option>
              <option value="6" data-en="6+ Guests" data-ar="6+ ضيوف">6+ Guests</option>
            </select>
            <label class="float-label" data-en="Number of Guests" data-ar="عدد الضيوف">Number of Guests</label>
          </div>
          <div class="form-group">
            <select id="resOccasion">
              <option value="" data-en="Select Occasion" data-ar="اختر المناسبة">Select Occasion</option>
              <option value="dinner" data-en="Royal Dinner" data-ar="عشاء ملكي">Royal Dinner</option>
              <option value="celebration" data-en="Celebration" data-ar="احتفال">Celebration</option>
              <option value="business" data-en="Business Meeting" data-ar="اجتماع عمل">Business Meeting</option>
              <option value="private" data-en="Private Event" data-ar="مناسبة خاصة">Private Event</option>
            </select>
            <label class="float-label" data-en="Occasion" data-ar="المناسبة">Occasion</label>
          </div>
        </div>
        <div class="form-group full">
          <textarea id="resMessage" rows="3" placeholder=" "></textarea>
          <label for="resMessage" data-en="Special Requests (Optional)" data-ar="طلبات خاصة (اختياري)">Special Requests (Optional)</label>
        </div>
        <button type="submit" class="btn-primary submit-btn" data-en="Confirm Reservation" data-ar="تأكيد الحجز">Confirm Reservation</button>
      </form>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="../js/components.js?v=1784947353?v=1784943920?v=1784943514"></script>
  <script src="../js/main.js?v=1784947353?v=1784943920?v=1784943514"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSharedComponents('reservation');
      document.getElementById('reservationForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('.submit-btn');
        const lang = document.querySelector('.lang-btn.active')?.dataset.lang || 'en';
        btn.textContent = lang === 'en' ? '✓ Reserved!' : '✓ تم الحجز!';
        btn.style.background = '#006C35';
        setTimeout(() => {
          btn.textContent = lang === 'en' ? 'Confirm Reservation' : 'تأكيد الحجز';
          btn.style.background = '';
          e.target.reset();
        }, 3000);
      });
    });
  </script>
</body>
</html>
