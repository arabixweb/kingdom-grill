<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القائمة | Menu — Kingdom Grill</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <section class="page-hero">
    <div class="page-hero-particles"></div>
    <div class="page-hero-content">
      <span class="page-badge" data-en="✦ Our Offerings ✦" data-ar="✦ ما نقدمه ✦">✦ Our Offerings ✦</span>
      <h1 class="page-title" data-en="Royal Signature" data-ar="الملكية">Royal Signature</h1>
      <h1 class="page-title accent" data-en="Dishes" data-ar="الأطباق المميزة">Dishes</h1>
    </div>
  </section>

  <section class="section">
    <div class="menu-categories">
      <button class="menu-cat active" data-cat="all" data-en="All" data-ar="الكل">All</button>
      <button class="menu-cat" data-cat="appetizers" data-en="Appetizers" data-ar="مقبلات">Appetizers</button>
      <button class="menu-cat" data-cat="mains" data-en="Main Course" data-ar="الأطباق الرئيسية">Main Course</button>
      <button class="menu-cat" data-cat="desserts" data-en="Desserts" data-ar="الحلويات">Desserts</button>
      <button class="menu-cat" data-cat="beverages" data-en="Beverages" data-ar="المشروبات">Beverages</button>
    </div>
    <div class="menu-grid" id="menuGrid"></div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="../js/components.js"></script>
  <script src="../js/menu-data.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSharedComponents('menu');
      renderMenuItems(menuData.appetizers.concat(menuData.mains).concat(menuData.desserts).concat(menuData.beverages));
    });

    document.querySelectorAll('.menu-cat').forEach(cat => {
      cat.addEventListener('click', () => {
        document.querySelectorAll('.menu-cat').forEach(c => c.classList.remove('active'));
        cat.classList.add('active');
        const catName = cat.dataset.cat;
        if (catName === 'all') {
          renderMenuItems(menuData.appetizers.concat(menuData.mains).concat(menuData.desserts).concat(menuData.beverages));
        } else {
          renderMenuItems(menuData[catName]);
        }
      });
    });
  </script>
</body>
</html>
